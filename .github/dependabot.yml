version: 2
updates:
  # The root manifest covers every workspace package: Dependabot reads
  # pnpm-workspace.yaml and bumps packages/*/package.json in the same PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Minor and patch bumps arrive as one PR a week. Majors stay separate,
      # since each can break the build in its own way.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
