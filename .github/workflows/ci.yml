name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The atlas the game ships is a checked-in scan of this repository
      # (ADR-0039). A stale one does not look broken, it looks like a smaller
      # codebase — so a structural change that was not rescanned fails here.
      - name: Architecture map is current
        run: pnpm architecture:check

      - name: Build production app
        run: pnpm build

      - name: Test (with coverage thresholds)
        run: pnpm coverage

      # The golden replays are the economics review in test form: if the
      # engine's behaviour shifts, this fails until the change is deliberately
      # blessed. Runs as part of `pnpm test`, called out here for reviewers.
      - name: Balance smoke (no NaN, no price explosions)
        run: pnpm batch -- --runs 200 --ticks 120 --policy random
